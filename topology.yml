name: return-to-libc-tp

hosts:
  - name: pwn
    base_box:
      image: seed
      mgmt_user: ubuntu
    flavor: m1.medium

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: m1.small

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: pwn-switch
    cidr: 10.1.26.0/24

net_mappings:
  - host: pwn
    network: pwn-switch
    ip: 10.1.26.10

router_mappings:
  - router: router
    network: pwn-switch
    ip: 10.1.26.1

groups: []
